<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Atlas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="hero-container">
        <header class="hero-header">
            <span class="badge">Etherium Flight Route</span>
            <h1 class="main-title">CELESTIAL ATLAS</h1>
            <p class="subtitle">Trace the historical expedition route across planets, trading havens and ancient space anomalies.</p>
        </header>

        <div class="atlas-hud">
            <div class="hud-item">CURRENT SECTOR: <span>MAGELLANIC CLOUDS</span></div>
            <div class="hud-item">MAP STATUS: <span>ACTIVE & ALIGNED</span></div>
            <div class="hud-item">DESTINATION: <span>TREASURE PLANET</span></div>
        </div>
    </main>




</body>

</html>
